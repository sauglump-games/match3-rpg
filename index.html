<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEM CRAWLER</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GEM CRAWLER</h1>
        <div class="hud">
            <div id="banner" class="banner"></div>
            <div id="resources" class="resources"></div>
            <div id="factions" class="factions"></div>
            <div id="relic-shelf" class="stash-shelf empty">Stash empty</div>
            <div class="hud-controls">
                <span>Turn timer: <span id="timer" class="timer">45s</span></span>
                <button id="quests-btn">Quests</button>
                <button id="codex-btn">Codex</button>
                <button id="elements-btn">Elements</button>
                <button id="log-btn">Log</button>
                <button id="history-btn">History</button>
                <button id="commit-btn" class="primary">FIGHT!</button>
                <button id="new-run-btn">New Run</button>
            </div>
        </div>
    </header>

    <main>
        <aside class="party-side">
            <div id="party" class="party"></div>
        </aside>

        <section class="center-stage">
            <section id="play-area" class="play-area">
                <div id="encounter-header" class="encounter-header"></div>
                <div id="board" class="board"></div>
                <div id="score-tally" class="score-tally"></div>
            </section>
            <section id="map" class="map"></section>
        </section>

        <aside class="combat-side">
            <div id="enemies" class="enemies"></div>
            <div id="ult-meter" class="ult-meter"></div>
        </aside>
    </main>

    <!-- WoW-style action bar, fixed at the bottom. -->
    <footer id="spell-tray" class="spell-tray"></footer>

    <!-- Log lives in DOM so renderLog can keep appending; the Log button
         in the HUD surfaces it as a modal overlay on demand. -->
    <ul id="log" class="log log-hidden"></ul>

    <div id="overlay" class="overlay"></div>

    <script type="module" src="lib/main.js"></script>
</body>
</html>
